# Applies contributor and link-change rules to pull requests opened directly.
#
# pull_request_target runs with a write token, so this workflow must never check
# out, build, or execute code from the pull request. It checks out the base branch
# (trusted) and reads the pull request only through the API.
name: PR guard

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR code is never checked out or run; see header.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  guard:
    name: Check contributor and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # labels and the guard comment
      pull-requests: write # close pull requests that fail contributor checks
    concurrency:
      group: pr-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out base branch (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r scripts/requirements.txt

      - name: Guard pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_guard.py
