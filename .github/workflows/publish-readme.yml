# Regenerates README.md from data/entries after changes land on main and commits it
# with the GitHub App (the app must be a bypass actor in the branch ruleset).
name: Publish README

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "README.md"
      - "scripts/build_readme.py"
      - "scripts/common.py"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Regenerate README
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: submission-bot
    permissions:
      contents: read
    concurrency:
      group: publish-readme
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r scripts/requirements.txt

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Regenerate and commit README
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/maintenance.py publish-readme --branch main --base-sha "$GITHUB_SHA"
