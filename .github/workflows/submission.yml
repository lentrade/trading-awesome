# Turns "Add a service" / "Update an entry" issue forms into pull requests.
#
# Security model:
# - The issue body is untrusted. It is read by scripts/submission.py from the event
#   file and never interpolated into a shell command.
# - Runs the workflow and scripts from the default branch only (issues events).
# - The GitHub App key lives in the `submission-bot` environment, restricted to main.
#   The installation token is scoped to contents/pull-requests/issues on this repo.
# - Pull requests created with the app token trigger CI; a maintainer merges by hand.
name: Submission bot

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

jobs:
  process:
    name: Check submission
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') &&
      (github.event.action != 'labeled' || github.event.label.name == 'maintainer-approved')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: submission-bot
    permissions:
      contents: read
    concurrency:
      group: submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r scripts/requirements.txt

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Process submission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/submission.py
